; NorseDistributor settings. The rules themselves go in the distributions folder beside this file (see distributions\README.txt).
[General]
; 0 trace, 1 debug, 2 info (every change is logged), 3 warn, 4 error
uLogLevel=2
; distribute at each map load (the game reloads unit assets between maps)
bApplyOnMapLoad=1
; where NorseDistributor.log and dumps\ are written; empty = this folder
sLogDir=
